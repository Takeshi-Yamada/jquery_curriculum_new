<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
    // 回答はここに書いてね
    $(function() {

      let encounterHtml =
        `
          <p class="name"></p>
          <div>
            <img class="img" src="" alt="見つけたポケモンの画像">
          </div>
          <div>
            <button class="btn" id="catch">捕まえる</button>
            <button class="btn" data-js="reset">逃げる</button>
          </div>
        `;

      let doneHtml =
        `
          <p class="name">ゲットしました</p>
          <div>
            <img class="img" src="" alt="モンスターボール">
          </div>
          <button class="btn" data-js="reset">戻る</button>
        `;

      let failHtml =
        `
          <p class="text">逃げられてしまった...</p>
          <button class="btn mt" data-js="reset">戻る</button>
        `;

      let searchHtml =
        `
          <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
        `;

      let errHtml =
        `
          <p class="name">エラーが発生しました</p>
        `;

      function japanese(data) {
        $.ajax({
          url:data.species.url,
          dataType: 'json',
          success: function(nameData){
            const pokemonName = nameData.names.find(name => name.language.name === 'ja').name
            $('.name').text(pokemonName);
          }
        });
      }

      //見つける処理
      $(document).on('click', '#pokemon_search',function(){
        const pokeId = Math.floor(Math.random() * 151) + 1;
        $.ajax({
          url: `https://pokeapi.co/api/v2/pokemon/${pokeId}/`,
          method: 'GET',
          dataType: 'json'
        }).done(function(res) {
          $('#wrapper').children().replaceWith(encounterHtml);
          $('img').attr('src', res.sprites.front_default);
          japanese(res);
        }).fail(function(err) {
          $('#wrapper').children().replaceWith(failHtml);
        });
      });

      //捕まえるor逃げる処理
      $(document).on('click', '#catch', function(){
        $.ajax({
          url: 'https://pokeapi.co/api/v2/item/4',
          method: 'GET'
        }).done(function(res) {
          let isGet = Math.random() < 0.5;
          console.log(isGet);
          if (isGet) {
            $('#wrapper').html(doneHtml);
            $('img').attr('src', res['sprites']['default']);
          } else {
            $('#wrapper').html(failHtml);
          }
        }).fail(function(err) {
          $('#wrapper').html(errHtml);
        });
      });

      //リセット処理
      $(document).on('click', '[data-js="reset"]', function(){
        $('#wrapper').html(searchHtml);
      });
    });
  </script>
</body>
</html>
